name: documentation

on:
  push:
      branches: [ "test-action" ]
  pull_request:
      types: [opened, ready_for_review, closed]
  workflow_dispatch:

permissions:
  contents: write

env:
  MLM_LICENSE_TOKEN: ${{ secrets.MATLAB_TOKEN }}
jobs:
  test-action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Set up MATLAB
        uses: matlab-actions/setup-matlab@v2
        with:
          release: R2024a
          cache: true
          products: >
            Simulink
            Aerospace_Toolbox
            Aerospace_Blockset
      - name: Install MATLAB Engine
        run: |
          MATLAB_EXEC=$(whereis matlab | awk '{print $2}')
          MATLAB_ROOT=$(dirname $(dirname $MATLAB_EXEC))
          cd "$MATLAB_ROOT/extern/engines/python"
          python setup.py install --user
      - name: Verify matlab installation
        run: |
          matlab -batch "1+1"
      - name: Verify MATLAB Engine
        run: |
          python -c "import matlab.engine; eng = matlab.engine.start_matlab(); print(eng.sqrt(16.0))"
